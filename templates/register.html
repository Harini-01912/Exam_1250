<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration</title>
</head>
<body>
    <center>
        <h2>Registration Page</h2>
        <form action="success.html" method="POST">
            Name:<input type="text" name="name" required>
            Roll Number:<input type="text" name="rollnum">

            <button type="submit">Register</button>

        </form>
    </center>
</body>
</html>
